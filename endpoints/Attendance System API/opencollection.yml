opencollection: 1.0.0

info:
  name: Attendance System API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Content-Type
      value: application/json
      disabled: true
    - name: Content-Type
      value: multipart/form-data
      disabled: true
    - name: Accept
      value: application/json
  variables:
    - name: baseUrl
      value: http://127.0.0.1:8001/api/v1/
    - name: apiUrl
      value: http://127.0.0.1:8001/api/
    - name: holidayId
      value: REPLACE_WITH_HOLIDAY_ID
    - name: shiftId
      value: REPLACE_WITH_SHIFT_ID
    - name: attendanceCorrectionId
      value: REPLACE_WITH_ATTENDANCE_CORRECTION_ID
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

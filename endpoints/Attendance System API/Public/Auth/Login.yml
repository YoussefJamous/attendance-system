info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}auth/login"
  body:
    type: form-urlencoded
    data:
      - name: email
        value: hr@example.com
      - name: password
        value: Password123!
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

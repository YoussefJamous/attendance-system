info:
  name: Save System Configurations
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}system-configuration"
  body:
    type: multipart-form
    data:
      - name: _method
        type: text
        value: PUT
      - name: attendance_method
        type: text
        value: gps
      - name: minimum_action_interval_minutes
        type: text
        value: "1"
        disabled: true
      - name: grace_minutes
        type: text
        value: "0"
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

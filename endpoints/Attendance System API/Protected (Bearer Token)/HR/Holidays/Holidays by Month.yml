info:
  name: Holidays by Month
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}holidays"
  params:
    - name: month
      value: 2026-01
      type: query
    - name: per_page
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

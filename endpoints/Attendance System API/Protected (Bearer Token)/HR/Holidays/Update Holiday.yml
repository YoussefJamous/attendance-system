info:
  name: Update Holiday
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}holidays/{{holidayId}}"
  body:
    type: multipart-form
    data:
      - name: _method
        type: text
        value: PATCH
      - name: description
        type: text
        value: Updated holiday description
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

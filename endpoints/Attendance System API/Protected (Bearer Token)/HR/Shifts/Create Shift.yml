info:
  name: Create Shift
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}shifts"
  body:
    type: json
    data: |-
      {
        "name": "Office Shift",
        "description": "Standard office schedule",
        "is_active": true,
        "days": [
          {
            "day_of_week": "monday",
            "work_start_time": "09:00",
            "work_end_time": "18:00",
            "break_duration_minutes": 60
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Submit Attendance Correction
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}attendance-corrections"
  body:
    type: json
    data: |-
      {
        "attendance_id": "REPLACE_WITH_ATTENDANCE_ID",
        "note": "Correcting my attendance timeline.",
        "logs": [
          {
            "action": "clock_in",
            "action_at": "2026-07-20 09:00:00"
          },
          {
            "action": "clock_out",
            "action_at": "2026-07-20 18:00:00"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
